[package]
name = "noxid-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
iroh.workspace = true
iroh-live = { workspace = true, features = ["capture", "playback", "aec", "sound-server"] }
iroh-moq.workspace = true
moq-media = { workspace = true, features = ["capture", "playback", "aec", "sound-server"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bs58 = "0.5"
hex = "0.4"
getrandom = "0.4"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The same releases moq-audio and iroh-live link, so nothing builds twice:
# cpal for our own microphone and the Linux monitor capture, moq-net for media
# timestamps, n0-future for the PCM stream handed to the publisher.
cpal = "0.18"
moq-net = "0.3"
# WebRTC's audio processing in pure Rust (moq-audio's echo canceller uses it
# too): noise suppression and adaptive gain for our microphone.
sonora = "0.2"
n0-future = "0.3"
bytes = "1"
# Profile pictures are named by their hash; iroh already links this release.
blake3 = "1.8"

# WASAPI process loopback, for sharing the PC's sound without Noxid's own
# output in it, GDI for border-free stills in the share picker, DirectShow
# for the cameras Media Foundation cannot open, and Windows Graphics Capture
# for shared windows. Same release moq-video already compiles.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
windows-core = "0.62"
# BGRA to I420 for those windows' pictures, the conversion moq-video uses for
# its own screen captures. Same release it already compiles.
yuv = "0.8"

# The desktop portal's D-Bus connection, opened on our own runtime so it
# outlives each share; see `media::keep_portal_connection`. Same release
# moq-video already compiles.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", optional = true, default-features = false, features = ["tokio", "screencast"] }

[features]
# Generated video and audio, so a call can be tested without devices.
test-source = ["moq-media/test-source"]
# Linux screen capture through xdg-desktop-portal, which Wayland requires.
# Links libpipewire-0.3, so it is opt-in.
pipewire = ["moq-media/pipewire", "dep:ashpd"]

[dev-dependencies]
anyhow.workspace = true
