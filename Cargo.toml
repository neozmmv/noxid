[workspace]
members = ["crates/noxid-core", "crates/noxid-cli", "app/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# iroh-live is an early tech preview with no crates.io release we can rely on,
# so it is pinned to an exact revision and only ever moved on purpose.
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "dd80d44efb587f31deed14fc11eeaa12946c9fd2", default-features = false }
iroh-moq = { git = "https://github.com/n0-computer/iroh-live", rev = "dd80d44efb587f31deed14fc11eeaa12946c9fd2" }
moq-media = { git = "https://github.com/n0-computer/iroh-live", rev = "dd80d44efb587f31deed14fc11eeaa12946c9fd2", default-features = false }
# Must stay on the same release iroh-live links, or every iroh type crossing
# the boundary becomes a different type.
iroh = "1.2"
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
noxid-core = { path = "crates/noxid-core" }
