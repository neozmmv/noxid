name: Release

# Runs only for release tags. Lint, tests and the installers build side by
# side, and the release waits for all of them: if any fails, nothing is
# published.
on:
  push:
    # vMAJOR.MINOR.PATCH, e.g. v0.1.0. Other tags build nothing.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # A manual run checks and bundles without publishing (the release job
  # only runs for a tag).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # The version and components come from rust-toolchain.toml.
      - name: rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: system deps
        uses: ./.github/actions/system-deps

      # The app crate embeds the built frontend, so it has to exist before
      # anything in the workspace compiles.
      - name: frontend
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Every test lives in noxid-core. Testing the whole workspace would also
      # build the Tauri app in debug just to run nothing in it; clippy above
      # already checks it.
      - name: test
        run: cargo test -p noxid-core
        env:
          # Enough for backtraces with file and line, at a fraction of full
          # debug info's link time and cache size.
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_PROFILE_TEST_DEBUG: line-tables-only

  # Not waiting for the tests: only the release needs both, and building
  # alongside them saves the whole length of the test job.
  bundle:
    name: bundle ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            bundles: nsis
          - name: linux-x86_64
            os: ubuntu-latest
            bundles: deb,rpm,appimage
    steps:
      - uses: actions/checkout@v4
      - name: rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: bundle-${{ matrix.name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: system deps
        uses: ./.github/actions/system-deps

      - name: install frontend deps
        working-directory: app
        run: bun install --frozen-lockfile

      # On a tag the installers carry the tag's version; otherwise the one in
      # tauri.conf.json. The leading `v` is not part of a semver.
      - name: bundle
        working-directory: app
        shell: bash
        env:
          # linuxdeploy's bundled strip is older than Ubuntu 24.04's libraries
          # and fails on them; the binaries are fine unstripped.
          NO_STRIP: "true"
        run: |
          args=(--bundles "${{ matrix.bundles }}")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            args+=(--config "{\"version\":\"${GITHUB_REF_NAME#v}\"}")
          fi
          bun run tauri build "${args[@]}"

      # Stable asset names, so the install scripts can always fetch
      # releases/latest/download/<name> without asking the API what the
      # version-stamped file is called.
      - name: stage (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName "dist/noxid-${{ matrix.name }}-setup.exe"
          Copy-Item scripts/install.ps1 dist/install.ps1
          Get-ChildItem dist -File | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  $($_.Name)" |
              Out-File -Encoding ascii "$($_.FullName).sha256"
          }
          Get-ChildItem dist

      - name: stage (linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/bundle/deb/*.deb "dist/noxid-${{ matrix.name }}.deb"
          cp target/release/bundle/rpm/*.rpm "dist/noxid-${{ matrix.name }}.rpm"
          cp target/release/bundle/appimage/*.AppImage "dist/noxid-${{ matrix.name }}.AppImage"
          cp scripts/install.sh dist/install.sh
          cd dist
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: noxid-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    needs: [test, bundle]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Noxid ${{ github.ref_name }}
          files: |
            noxid-*
            install.*
          generate_release_notes: true
