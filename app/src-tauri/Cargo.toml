[package]
name = "noxid-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "noxid_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
noxid-core.workspace = true
iroh.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tauri = { version = "2.12", features = [] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
getrandom = "0.4"
hex = "0.4"
# The native file picker for "Send a file", and "Show in folder" for a
# received one. Both are used from Rust only, so the webview gets no new
# permissions.
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
# The update check. Already in the tree through iroh; rustls reads the
# system's CA certificates wherever the distro keeps them.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

# Wayland only allows screen capture through xdg-desktop-portal and PipeWire.
[target.'cfg(target_os = "linux")'.dependencies]
noxid-core = { workspace = true, features = ["pipewire"] }
